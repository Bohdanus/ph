name: Focused E2E

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Hosted operating system to run the spec on
        required: true
        type: choice
        options:
          - linux
          - windows
          - macos
        default: linux
      spec:
        description: One Playwright spec path under e2e/, for example e2e/export/visual-regression.spec.ts
        required: true
        type: string

permissions:
  contents: read

jobs:
  focused-e2e:
    runs-on: ${{ inputs.platform == 'linux' && 'ubuntu-latest' || inputs.platform == 'windows' && 'windows-latest' || 'macos-latest' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome with Linux dependencies
        if: ${{ inputs.platform == 'linux' }}
        run: npx playwright install --with-deps chrome

      - name: Install Chrome
        if: ${{ inputs.platform != 'linux' }}
        run: npx playwright install chrome

      - name: Run focused Playwright spec
        env:
          E2E_SPEC: ${{ inputs.spec }}
        shell: bash
        run: |
          set -euo pipefail
          case "$E2E_SPEC" in
            e2e/*.spec.ts) ;;
            *) echo "::error::spec must be one Playwright spec under e2e/" >&2; exit 1 ;;
          esac
          if [ ! -f "$E2E_SPEC" ]; then
            echo "::error::Playwright spec does not exist: $E2E_SPEC" >&2
            exit 1
          fi
          spec_path="$(realpath -- "$E2E_SPEC")"
          e2e_root="$(realpath -- e2e)"
          case "$spec_path" in
            "$e2e_root"/*.spec.ts) ;;
            *) echo "::error::spec must resolve inside e2e/" >&2; exit 1 ;;
          esac
          npx playwright test "$E2E_SPEC"

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: focused-${{ inputs.platform }}-e2e-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: error
