name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Re-run a gate on demand without pushing an empty commit. The `e2e` matrix is
  # the one whose result a reviewer may want to confirm, especially on a platform
  # whose baselines were just recorded.
  workflow_dispatch:

# Superseded runs are pointless work, and this workflow is triggered on every push
# to a PR branch as well as `main`.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. No job in this workflow needs to write to the repository,
# and an un-scoped GITHUB_TOKEN inherits whatever the org default happens to be.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The citation guard compares additions against the PR/push base commit below.
          fetch-depth: 0
          # Nothing in this workflow pushes, tags or reads a private ref, so the
          # token the checkout leaves in .git/config is a credential with no job
          # that needs it. Combined with the read-only `permissions` above, a
          # compromised step cannot exfiltrate a usable token.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Read from .nvmrc rather than repeated here, so the runner and every
          # developer resolve the same major from one file.
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Reject new line-number citations
        env:
          CITATION_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        run: node scripts/check-new-line-citations.mjs --base "$CITATION_DIFF_BASE"

      - name: Lint
        run: npm run lint:check

      - name: Type-check
        # `tsc -b` builds tsconfig.app.json, tsconfig.node.json and tsconfig.e2e.json,
        # so this also type-checks the Playwright specs and their helper unit tests.
        run: npm run tsc

      - name: Assert every tracked TypeScript file is in a project
        # A `.ts`/`.tsx` that no project's `include` reaches is type-checked by
        # nothing: there is no error, and the file can sit there indefinitely. This
        # is the durable form of that check.
        #
        # Note the scope: `tsc -b --listFiles` reports the whole program, so this
        # fails for a file no project reaches at all. It does NOT fail for a file
        # that only some other file imports — such a file IS in the program, so
        # being reachable only through its importers stays invisible here. The
        # `toolbar-mapping.ts` case was that shape, and the fix for it is the
        # explicit `include` entry in tsconfig.app.json, not this step.
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          # A non-zero exit here fails the step, so a type error or a broken build
          # can never leave the comparison below running on a partial file list.
          npx tsc -b --listFiles > "$dir/all"
          # Strip the repo prefix without a regex: a checkout path containing a sed
          # metacharacter would otherwise corrupt every line. Anything not under the
          # repo root is reported on stderr rather than silently dropped.
          grep -v '/node_modules/' "$dir/all" \
            | awk -v root="$PWD/" \
                'index($0, root) == 1 { print substr($0, length(root) + 1); next } \
                 { print "!UNPREFIXED " $0 > "/dev/stderr" }' \
            | sort -u > "$dir/included"
          uncovered="$(comm -23 <(git ls-files '*.ts' '*.tsx' | sort -u) "$dir/included")"
          if [ -n "$uncovered" ]; then
            echo "::error::Tracked TypeScript files that no tsconfig project includes:"
            echo "$uncovered"
            exit 1
          fi
          echo "All $(git ls-files '*.ts' '*.tsx' | wc -l | tr -d ' ') tracked TypeScript files are type-checked by some project."

      - name: Test
        run: npm run test -- --coverage

      - name: Upload app coverage
        # The report is the point of `--coverage`; without an upload the run
        # computes lcov and throws it away, and a coverage regression can only be
        # noticed by re-running the suite locally. `always()` so a failed run still
        # publishes the partial report that explains the failure.
        #
        # `always()` rather than `!cancelled()`, for the reason the `e2e` job's
        # report upload below states in full: `cancel-in-progress: true` at the top
        # makes a SUPERSESSION a cancellation, so `!cancelled()` is false in exactly
        # the case that throws evidence away.
        #
        # Not a gate. vitest.config.ts declares no `thresholds`, so this step can
        # only fail by finding no report at all.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: app-coverage
          path: |
            coverage/
          retention-days: 7
          if-no-files-found: error

      - name: Build
        run: npm run build

  # Dependency licence terms are not checked by CI. The `npm audit` step above
  # checks vulnerability advisories only; see the README's dependency licensing note.

  # The blocking gate for everything under e2e/.
  #
  # A separate job rather than a step in `ci`, so that a break anywhere in the app
  # pipeline cannot silently remove the only gate on this code: within one job a
  # failed step aborts the rest, and a step ordered after a failing one simply never
  # runs while the workflow still reads as if it were covered.
  #
  # Needs no browser and no application instance.
  e2e-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit test the e2e helpers
        run: npm run test:e2e:unit

      - name: Cover the e2e helpers
        # LAST, and deliberately still a gate. `test:e2e:unit:coverage` re-runs the
        # same suite with v8 instrumentation and reports into ./coverage-e2e. Ordered
        # after the real gate so it cannot be skipped or obscured by it: a failure here
        # is reported against a job whose tests already passed, and a failure in the gate
        # above aborts this step rather than letting coverage output stand in for it. It
        # is not `continue-on-error` — an untested change to these helpers would otherwise
        # ship the moment the coverage run broke for an unrelated reason.
        #
        # No type-check step: the `ci` job's `npm run tsc` is `tsc -b`, which builds
        # tsconfig.e2e.json along with the app and node projects, so a second scoped run
        # here could only repeat it.
        #
        # There are no coverage thresholds in vitest.e2e.config.ts, so this step
        # cannot go red on a percentage; it fails only if a test fails.
        run: npm run test:e2e:unit:coverage

      - name: Upload e2e helper coverage
        # `always()`, for the reason the `e2e` job's report upload states in full.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-helper-coverage
          path: |
            coverage-e2e/
          retention-days: 7
          if-no-files-found: error

  # Dependency licence terms are not checked by CI. The `npm audit` job below
  # checks vulnerability advisories only; see the README's dependency licensing note.
  # It runs as a separate non-blocking job so external advisories cannot block the
  # main pipeline.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------------
  # Cross-platform e2e
  #
  # A GATE, and the only one for the e2e specs themselves. A matrix runs the
  # same headless suite on Linux (macOS baselines), Windows and macOS.
  #
  # It was `continue-on-error: true` on the stated grounds that "5 of the 97 tests
  # fail": 2 CDP capture-size specs, 2 `levels.spec.ts` canvas-lookup specs, and a
  # sidebar keyboard flyout race. All three of those groups are fixed in this
  # repository, and are recorded as fixed in `e2e/OPEN_PROBLEMS.md` ("Observed
  # failures") and in `e2e/README.md`. The specs declare no `test.fail`, no
  # `test.fixme` and no `describe.skip`; the only three skips are unconditional
  # `test.skip` declarations in `e2e/export/photopea.spec.ts`,
  # `e2e/sidebar-flyout.spec.ts` and `e2e/viewport-drawing.spec.ts`. Nothing in
  # the tree marks a test as failing, so the stated justification had stopped
  # describing the suite, and the job went on reporting a state the suite no
  # longer had. The comment kept its number alive long after the failures behind
  # it were gone.
  #
  # It does not replace the `e2e-unit` job, which stays the gate for the helpers:
  # this one proves the specs pass, that one proves the helpers the specs call are
  # tested.
  #
  # This is the job's first run as a gate, and its first run on a Linux runner at
  # all, so a red first run is a real finding to investigate rather than a reason
  # to put `continue-on-error` back. What the job no longer rests on: the CDP
  # capture assertions are mode- and host-independent by construction -- they no
  # longer name a scale -- so the disjoint per-mode failing sets the old comment
  # described are empty by design rather than by observation. See
  # `e2e/OPEN_PROBLEMS.md`, "Verified and still unverified".
  #
  # The suite runs headless here, and that is not incidental: `playwright.config.ts`
  # defaults to headless so that no operator's mouse, keyboard or focus can reach
  # the page mid-run. A CI runner has no such input, but keeping the same default
  # locally is what stops that class of failure from being misread as flakiness.
  #
  # MISSING LINUX BASELINES. `visual-regression.spec.ts` reads its oracle from
  # `export-baselines/<platform>/`. `darwin/` and `win32/` are committed; `linux/`
  # is not, so the Linux leg fails closed with `Baseline missing for <format> on
  # linux`. Do not skip the spec or record Linux images from an unmatched machine:
  # `ubuntu-latest` is x86-64, while the available EC2 host is ARM64. Record the
  # Linux set with the manual `capture-linux-baselines.yml` workflow, then review
  # every image before committing it. CPU-only rendering is not sufficient: the
  # available EC2 host is ARM64 and this runner is x86-64. Until then, this is a
  # known red check, not a green or suppressed gate.
  e2e:
    strategy:
      # One platform failing must not cancel the others; a platform-specific
      # rasteriser regression remains useful even while Linux baselines are absent.
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            timeout: 30
            install-command: npx playwright install --with-deps chrome
          - platform: windows
            os: windows-latest
            timeout: 35
            install-command: npx playwright install chrome
          - platform: macos
            os: macos-latest
            timeout: 35
            install-command: npx playwright install chrome
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome
        # `playwright.config.ts` sets `channel: 'chrome'` — the Chrome stable
        # channel that Playwright installs, NOT the system browser. On Linux
        # `--with-deps` pulls the apt packages Chrome needs; on Windows and
        # macOS it is a bare `npx playwright install chrome` (the `--with-deps`
        # flag is Linux-only; the matrix carries an explicit command for each
        # runner so macOS and Windows never rely on shell semantics).
        #
        # No `actions/cache` step on purpose. That directory is where Playwright
        # unpacks the browsers IT downloads, and this job installs none: the
        # `chrome` channel goes through the OS package manager on Linux. A cache
        # keyed on `~/.cache/ms-playwright` here would carry an absent directory,
        # hit on every run, and save nothing. The install below is apt on Linux,
        # which is not cacheable.
        run: ${{ matrix.install-command }}

      - name: Run Playwright specs
        # `npx playwright test` directly, NOT `npm run test:e2e`. That script is
        # `scripts/e2e-run.mjs`, which takes an advisory swarm lock and gives each
        # run a private port and output directory — correct for a machine where
        # several agents run suites at once, and wrong here: this job owns its
        # checkout outright, and the wrapper's per-run output directory is not where
        # this job's artifacts are collected from. The own-server guarantee is NOT
        # skipped with the wrapper: `e2e/global-setup.ts` enforces it for every
        # invocation, including this one.
        #
        # playwright.config.ts declares a `webServer` running `npm run dev`, and
        # `reuseExistingServer` is an unconditional `false` with `--strictPort` on
        # the server command, so the job always starts its own server on :5173 and a
        # port clash is a hard failure rather than a silent attach.
        #
        # No --grep-invert: this job reports the true state of the suite. A failure
        # here is a new defect unless e2e/OPEN_PROBLEMS.md says otherwise, and
        # filtering failures out would hide the one signal this job now exists to
        # give.
        run: npx playwright test

      - name: Upload Playwright report
        # `always()`, and NOT `!cancelled()`. `cancel-in-progress: true` at the top
        # of this file means the most common cancellation is a SUPERSESSION — this
        # run was replaced by a newer push — and `!cancelled()` is false in exactly
        # that case. The old gate therefore discarded the evidence of precisely the
        # runs most worth reading: one cancelled mid-suite, whose `test-results/`
        # already holds the failing screenshot and the first-retry trace of whatever
        # was running when it was superseded. `always()` is the only status function
        # that is true under a cancellation; `success() || failure()` is
        # `!cancelled()` spelled out.
        #
        # It does NOT rescue a job GitHub killed for exceeding `timeout-minutes`:
        # the remaining steps do not run at all, whatever their `if:` says. That is
        # why `playwright.config.ts` carries a `globalTimeout` STRICTLY BELOW this
        # job's `timeout-minutes` — Playwright trips its own deadline first,
        # writes the report, and exits 1, so a hang arrives here as an ordinary
        # failed step with its artifacts already on disk. The two settings are ONE
        # mechanism and neither is sufficient alone.
        #
        # The cost, stated rather than discovered later: a superseded run that had not
        # yet failed anything has only EMPTY per-test directories under
        # `test-results/`, and no `playwright-report/` either, because the HTML
        # reporter writes in `onEnd` at the very end of a run. With
        # `if-no-files-found: error` below, that step goes red. The RUN's conclusion
        # is still `cancelled` — GitHub decides that, not the step — and a superseded
        # run is by definition not the latest run, which is the one a required status
        # check reads. So the new red lands on a run nobody reads, and it is a true
        # statement about it: that run produced no report.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.platform }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          # `error`, NOT `ignore`. `ignore` makes a run that wrote NO report at all a
          # GREEN upload step, which is the same hole `failOnFlakyTests` closes on the
          # exit code: the evidence is missing and nothing says so. The report is the
          # only record of what the suite actually did, and the other uploads in
          # this workflow already treat a missing report as an error.
          if-no-files-found: error
