name: Capture export baseline artifacts
run-name: Export baselines (${{ inputs.platform }}) @ source ${{ inputs.source_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Operating system to capture
        required: true
        type: choice
        default: all
        options:
          - all
          - linux
          - windows
          - macos
      source_sha:
        description: Full commit SHA to capture; leave blank to capture the selected main revision
        required: false
        type: string
        default: ''

concurrency:
  group: export-baselines-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.validate-target.outputs.source_sha }}
      platforms: ${{ steps.validate-target.outputs.platforms }}
    steps:
      - name: Require trusted mirror main and resolve the capture revision
        id: validate-target
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          PLATFORM: ${{ inputs.platform }}
          SOURCE_SHA_INPUT: ${{ inputs.source_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${REPOSITORY,,}" == "bohdanus/ph" ]] || { echo "::error::Export baseline capture is restricted to Bohdanus/ph"; exit 1; }
          [[ "$REF" == "refs/heads/main" ]] || { echo "::error::Export baseline capture must run from trusted main"; exit 1; }
          case "$PLATFORM" in
            all) platforms='["linux","windows","macos"]' ;;
            linux) platforms='["linux"]' ;;
            windows) platforms='["windows"]' ;;
            macos) platforms='["macos"]' ;;
            *) echo "::error::Unsupported platform: $PLATFORM"; exit 1 ;;
          esac
          source_sha="${SOURCE_SHA_INPUT:-$WORKFLOW_SHA}"
          [[ "$source_sha" =~ ^([a-fA-F0-9]{40}|[a-fA-F0-9]{64})$ ]] || { echo "::error::source_sha must be a full Git object ID"; exit 1; }
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'platforms=%s\n' "$platforms" >> "$GITHUB_OUTPUT"

  capture:
    needs: validate
    runs-on: ${{ matrix.platform == 'linux' && 'ubuntu-latest' || matrix.platform == 'windows' && 'windows-latest' || 'macos-latest' }}
    timeout-minutes: 80
    env:
      PLAYWRIGHT_CHROME_VERSION: '156.0.8078.47'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.validate.outputs.platforms) }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome
        run: ${{ matrix.platform == 'linux' && 'npx playwright install --with-deps chrome' || 'npx playwright install chrome' }}

      - name: Record export baselines
        run: npm run test:e2e:update-baselines -- --workers=1

      - name: Verify recorded baselines
        run: npm run test:e2e -- e2e/export/visual-regression.spec.ts --workers=1

      - name: Validate exact platform baseline set
        shell: bash
        env:
          SNAPSHOT_PLATFORM: ${{ matrix.platform == 'windows' && 'win32' || matrix.platform == 'macos' && 'darwin' || 'linux' }}
        run: |
          node --input-type=module <<'NODE'
          import { lstatSync, readFileSync, readdirSync } from 'node:fs';

          const dir = `e2e/export/visual-regression.spec.ts-snapshots/export-baselines/${process.env.SNAPSHOT_PLATFORM}`;
          const directory = lstatSync(dir);
          if (!directory.isDirectory() || directory.isSymbolicLink()) throw new Error(`${dir} is not a regular directory`);
          const expected = [
            'drawing.avif.png',
            'drawing.bmp.png',
            'drawing.gif.png',
            'drawing.jpeg.png',
            'drawing.png.png',
            'drawing.svg.png',
            'drawing.webp.png',
          ].sort();
          const actual = readdirSync(dir).sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Expected exactly ${expected.join(', ')} in ${dir}; found ${actual.join(', ')}`);
          }
          for (const name of expected) {
            const file = `${dir}/${name}`;
            if (!lstatSync(file).isFile()) throw new Error(`${file} is not a regular file`);
            const signature = readFileSync(file).subarray(0, 8).toString('hex');
            if (signature !== '89504e470d0a1a0a') throw new Error(`${file} is not a PNG`);
          }
          NODE

      - name: Upload export baseline artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}-export-baselines-source-${{ needs.validate.outputs.source_sha }}-workflow-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e/export/visual-regression.spec.ts-snapshots/export-baselines/${{ matrix.platform == 'windows' && 'win32' || matrix.platform == 'macos' && 'darwin' || 'linux' }}/
          retention-days: 7
          if-no-files-found: error

      - name: Upload Playwright diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}-baseline-diagnostics-source-${{ needs.validate.outputs.source_sha }}-workflow-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
