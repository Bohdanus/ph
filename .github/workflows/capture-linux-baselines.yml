name: Capture cross-platform export baselines

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            snapshot-platform: linux
            install-command: npx playwright install --with-deps chrome
          - os: windows-latest
            snapshot-platform: win32
            install-command: npx playwright install chrome
          - os: macos-latest
            snapshot-platform: darwin
            install-command: npx playwright install chrome
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome
        run: ${{ matrix.install-command }}

      - name: Record export baselines
        run: npm run test:e2e:update-baselines -- --workers=1

      - name: Verify recorded baselines
        run: npm run test:e2e -- e2e/export/visual-regression.spec.ts --workers=1

      - name: Upload export baselines
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.snapshot-platform }}-export-baselines-${{ github.sha }}
          path: e2e/export/visual-regression.spec.ts-snapshots/export-baselines/${{ matrix.snapshot-platform }}/
          retention-days: 7
          if-no-files-found: error
